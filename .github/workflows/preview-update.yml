name: Preview update (private OTA)

# Over-the-air update to the *preview* channel only.
# Publishes whatever is on the chosen branch to the "preview" EAS branch, so a
# device running a preview build picks it up in ~1 minute — without a rebuild,
# without a Play submit, and WITHOUT touching production users (they are on the
# separate "production" channel).
#
# It runs on every merge to main, because the three places this app reaches
# people should never be able to drift apart: the website, production users,
# and the preview device. The other two already published themselves on a merge
# — only this one waited to be asked, so the preview build was current exactly
# as often as somebody remembered to ask. That is not a delivery mechanism, it
# is a habit, and it is the same shape of gap that left ahenora.com three days
# stale while every check stayed green.
#
# workflow_dispatch stays, for previewing a draft branch before it merges.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/preview-update.yml'
  workflow_dispatch:
    inputs:
      message:
        description: 'Short note shown in the update history'
        required: false
        default: 'preview update'

concurrency:
  group: preview-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview-update:
    name: Publish preview OTA update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL || vars.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_NO_TELEMETRY: 1
      # Stamp the preview OTA with its commit, so Settings shows which preview
      # build a phone is actually running.
      EXPO_PUBLIC_BUILD_TAG: ${{ github.sha }}
    steps:
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # BOTH platforms — and unlike the production workflow, that is safe here.
      #
      # This publishes to the `preview` EAS branch. App Review runs a build on
      # the `production` channel, and the two never meet, so an update sent
      # here cannot change the app underneath a review in progress. The
      # production workflow stays pinned to android until iOS is approved; this
      # one does not have to.
      #
      # It matters now because the iPhone tester is a real co-parent in a real
      # household, reproducing bugs the Android side cannot: an invite arriving
      # by email, opened on a phone, and a notification that has to cross
      # between the two. Leaving her on a channel that receives nothing means
      # every iOS fix waits on Apple before anybody can tell whether it worked.
      #
      # The comments live ABOVE the run block, not inside it: a `#` line inside
      # a `\` continuation does not comment the flag out, it ends the command
      # early and leaves the next line to be executed as its own command. The
      # previous version of this step did exactly that and would have exited
      # 127 on the next merge to main.
      - name: Publish update to the preview channel
        working-directory: frontend
        # The dispatch input goes through env, never straight into the script.
        # Interpolated with ${{ }} it is pasted into the shell BEFORE bash sees
        # it, so a message containing a quote and a semicolon runs as commands
        # — in the one job that holds EXPO_TOKEN and publishes code to real
        # devices. As an env var it is only ever data.
        env:
          UPDATE_MESSAGE: ${{ github.event.inputs.message || 'merge to main' }}
        run: |
          npx eas-cli@latest update \
            --platform all \
            --branch preview \
            --environment preview \
            --message "$UPDATE_MESSAGE ($GITHUB_SHA)" \
            --non-interactive
