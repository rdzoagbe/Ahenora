name: Backend CI

# The AI safety gate stands between a language model and a parent cooking for
# their children. It needs to fail the build when it breaks, not be verified by
# hand and quietly rot.

on:
  # Feature branches run CI too. Until now `push` was main-only, so a branch
  # push relied entirely on the pull_request event - and when that event did not
  # fire (it happened twice in one day), the PR sat with ZERO checks, looking
  # clean because nothing had run. A pull request with no checks is more
  # dangerous than one with a red X.
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'legal/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'legal/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  # Keyed on the head BRANCH, not the ref: a push and its pull request
  # produce different refs, so keying on ref would run everything twice.
  group: backend-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Byte-compile the backend
        run: python -m compileall -q backend

      # Without this the job was theatre. Nearly every test file opens with
      #
      #     try: import fastapi
      #     except ImportError: HAVE_DEPS = False
      #     @unittest.skipUnless(HAVE_DEPS, ...)
      #
      # which is right for a contributor's laptop and catastrophic in CI with
      # no install step: 805 of 926 tests SKIPPED and the job reported OK in
      # under a second. Every test covering authorization, privacy, billing and
      # the destructive admin routes was in the skipped set. A green tick meant
      # "the imports failed", and nothing downstream could tell the difference.
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyyaml

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      # The install above can rot the same way it was missing — a dependency
      # dropped from requirements.txt puts the suite straight back to skipping
      # green. So assert on the count: the suite must actually EXECUTE most of
      # what it discovers, and say so out loud when it does not.
      - name: Fail if the suite skipped instead of running
        run: |
          python - <<'PY'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=0).run(
              unittest.defaultTestLoader.discover("tests"))
          ran = result.testsRun - len(result.skipped)
          print(f"discovered={result.testsRun} executed={ran} "
                f"skipped={len(result.skipped)}")
          if result.testsRun and len(result.skipped) > result.testsRun * 0.1:
              sys.exit(
                  f"{len(result.skipped)} of {result.testsRun} tests SKIPPED. "
                  "A dependency is missing, so this job is not testing anything. "
                  "Green here would be a lie.")
          PY
