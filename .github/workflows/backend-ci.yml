name: Backend CI

# The AI safety gate stands between a language model and a parent cooking for
# their children. It needs to fail the build when it breaks, not be verified by
# hand and quietly rot.

on:
  # Feature branches run CI too. Until now `push` was main-only, so a branch
  # push relied entirely on the pull_request event - and when that event did not
  # fire (it happened twice in one day), the PR sat with ZERO checks, looking
  # clean because nothing had run. A pull request with no checks is more
  # dangerous than one with a red X.
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'legal/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'legal/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  # Keyed on the head BRANCH, not the ref: a push and its pull request
  # produce different refs, so keying on ref would run everything twice.
  group: backend-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Byte-compile the backend
        run: python -m compileall -q backend

      # ai_safety.py depends only on the standard library, by design — the gate
      # should not be able to fail because an install failed.
      - name: Run safety gate tests
        run: python -m unittest discover -s tests -v
