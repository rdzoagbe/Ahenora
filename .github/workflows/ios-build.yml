name: EAS Build (iOS)

# Manually-triggered cloud build (+ optional auto-submit to App Store Connect).
#
# Deliberately a SEPARATE workflow from the Android one rather than a platform
# input on it. The Android build is live and shipping to real users; the iOS
# path is new, needs credentials nobody has yet, and will fail repeatedly while
# it is being set up. Those two things should not share a file.
#
# What this cannot do for you: an iOS build needs an Apple Developer Program
# membership, and a signing certificate + provisioning profile that EAS creates
# ONCE from an interactive `eas credentials` run. Until that exists, this
# workflow stops at the preflight below with a readable message rather than
# failing four minutes into a build with an Xcode error.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Auto-submit to App Store Connect after build'
        required: true
        default: false
        type: boolean
      build:
        description: 'Build first (uncheck to submit the existing latest EAS build)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (and submit) iOS app
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      # Fails FAST and says exactly which field is still a placeholder. The
      # alternative is a build that runs for ten minutes and then dies on an
      # authentication error that names none of them.
      - name: Preflight — is the Apple side configured?
        working-directory: frontend
        env:
          WANT_SUBMIT: ${{ github.event.inputs.submit }}
        run: |
          missing=""
          for field in appleId ascAppId appleTeamId; do
            if grep -q "\"$field\": \"REPLACE_WITH" eas.json; then
              missing="$missing $field"
            fi
          done
          # The two iOS-only public keys live in EAS environment variables, not
          # in eas.json — an empty value there is rejected outright ("is not
          # allowed to be empty") and fails the build before it starts. Absent
          # is the correct way to say "not configured yet": the app degrades to
          # hiding Google sign-in and reporting subscriptions unavailable. Worth
          # saying out loud, because a build in that state must not be submitted.
          for var in EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID EXPO_PUBLIC_REVENUECAT_IOS_KEY; do
            if ! grep -q "$var" eas.json; then
              echo "::warning title=$var is not set::Google sign-in is hidden and subscriptions are unavailable in this build. Fine for TestFlight, NOT for App Review."
            fi
          done

          if [ -n "$missing" ]; then
            {
              echo "### iOS submit is not configured yet"
              echo ""
              echo "These fields in \`frontend/eas.json\` are still placeholders:**$missing**"
              echo ""
              echo "They come from the Apple Developer account:"
              echo "- \`appleId\` — the Apple ID email on the Developer Program membership"
              echo "- \`appleTeamId\` — Membership details in the Apple Developer portal"
              echo "- \`ascAppId\` — the numeric App ID, after the app record exists in App Store Connect"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$WANT_SUBMIT" = "true" ]; then
              echo "::error title=Cannot submit::eas.json still has placeholder Apple fields:$missing"
              exit 1
            fi
            echo "::warning title=Build only::Apple submit fields are placeholders; this run will build but not submit."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # No --auto-submit here: submitting is a separate, explicitly-guarded step
      # below, so a build that succeeds is never silently followed by a submit
      # that fails for an unrelated reason.
      #
      # Skippable, because the submit step below is `--latest` and does not care
      # how the build got there. Running with submit=false and then wanting the
      # binary in App Store Connect used to mean building the same commit twice,
      # ~7 minutes and an EAS build credit to upload something that already
      # existed — and it landed under a second build number, which makes the
      # version's build list harder to read, not easier.
      - name: Build with EAS
        if: ${{ github.event.inputs.build != 'false' }}
        working-directory: frontend
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive

      # Authentication for a NON-INTERACTIVE submit. An Apple ID alone cannot
      # do this: the Developer Program requires two-factor auth, and there is
      # nobody at a keyboard to approve a prompt. Two ways round it, and the
      # first is much the better one:
      #
      #   1. An App Store Connect API KEY (.p8 + key id + issuer id). No 2FA
      #      involved at all, revocable on its own, and not tied to a person —
      #      so it keeps working if the account owner changes their password.
      #   2. An app-specific password, generated at appleid.apple.com. Simpler
      #      to create, but it is a credential on the human account and dies
      #      with a password change.
      #
      # Set ONE of them in Settings > Secrets and variables > Actions.
      - name: Prepare App Store Connect credentials
        if: ${{ github.event.inputs.submit == 'true' }}
        id: asc
        working-directory: frontend
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            umask 077
            printf '%s' "$ASC_API_KEY_P8" > asc-api-key.p8
            echo "method=api-key" >> "$GITHUB_OUTPUT"
            echo "Using an App Store Connect API key." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "method=app-password" >> "$GITHUB_OUTPUT"
            echo "Using an app-specific password." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=No App Store Connect credentials::Set ASC_API_KEY_P8 + ASC_KEY_ID + ASC_ISSUER_ID (preferred), or APPLE_APP_SPECIFIC_PASSWORD."
            {
              echo "### Cannot submit — no credentials"
              echo ""
              echo "A non-interactive submit needs one of:"
              echo ""
              echo "- \`ASC_API_KEY_P8\` (contents of the .p8), \`ASC_KEY_ID\`, \`ASC_ISSUER_ID\`"
              echo "  — App Store Connect > Users and Access > Integrations > App Store Connect API"
              echo "- \`APPLE_APP_SPECIFIC_PASSWORD\` — appleid.apple.com > Sign-In and Security"
              echo ""
              echo "The build itself is unaffected and is on the EAS dashboard."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # --latest is the build EAS made most recently for this project, whether
      # that was the step above or an earlier run.
      - name: Submit latest build to App Store Connect
        if: ${{ github.event.inputs.submit == 'true' }}
        working-directory: frontend
        env:
          # Read by eas-cli when the matching secret was provided above. Both
          # are set unconditionally; only the configured one holds a value.
          EXPO_ASC_API_KEY_PATH: ${{ steps.asc.outputs.method == 'api-key' && './asc-api-key.p8' || '' }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          npx eas-cli@latest submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive

      # The .p8 is a long-lived credential. It never outlives the job.
      - name: Shred the API key
        if: ${{ always() }}
        working-directory: frontend
        run: rm -f asc-api-key.p8

      - name: Say what landed where
        if: ${{ always() }}
        run: |
          if [ "${{ github.event.inputs.submit }}" = "true" ]; then
            echo "Submitted to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 10-30 minutes)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built only. The .ipa is on the EAS dashboard and can be uploaded by hand via Transporter." >> "$GITHUB_STEP_SUMMARY"
          fi
