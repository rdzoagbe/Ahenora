name: Frontend CI and Expo update

on:
  # Feature branches run CI too. Until now `push` was main-only, so a branch
  # push relied entirely on the pull_request event - and when that event did not
  # fire (it happened twice in one day), the PR sat with ZERO checks, looking
  # clean because nothing had run. A pull request with no checks is more
  # dangerous than one with a red X.
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'frontend/**'
      - 'legal/**'
      - '.github/workflows/frontend-ci-eas-update.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'legal/**'
      - '.github/workflows/frontend-ci-eas-update.yml'
  workflow_dispatch:

concurrency:
  # Keyed on the head BRANCH, not the ref: a push and its pull request
  # produce different refs, so keying on ref would run everything twice.
  group: frontend-ci-eas-update-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend lint check
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Both of these existed only as a line in NATIVE_CONFIG.md telling a human
      # to remember. Neither was ever wired to anything, and both drifted: the
      # runtime version silently broke OTA delivery for nine days, and the
      # version name shipped 1.0.0 to Play while app.json said 1.0.2. A guard
      # nothing runs is a comment.
      - name: Check native config agrees with app.json
        run: node scripts/check-runtime-version.js

      - name: Check Android permissions
        run: node scripts/check-android-permissions.js

      # An OTA carries JavaScript to binaries that already exist. A native
      # dependency added in the same change is JS reaching for something they
      # do not contain, and that does not degrade — the app stops starting.
      # This is the gate that expo-audio went through without one.
      - name: Check no native dependency snuck into an OTA
        run: node scripts/check-native-deps.js

      - name: Run lint
        run: npm run lint --if-present

      # Neither of these was ever wired up, and the expo-update job below
      # `needs: frontend-ci` — so every OTA that has ever shipped to a real
      # Android phone was gated on LINT ALONE. package.json has had `test` and
      # `typecheck` scripts the whole time; CI simply never called them. A type
      # error or a failing test could not turn this workflow red, which is the
      # same failure as the backend job skipping its suite: the check existed,
      # it just was not measuring what its name implied.
      #
      # No --if-present here, deliberately. These scripts must exist; if one is
      # renamed away, the job should go red rather than quietly stop checking.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci


  web-export:
    name: Rebuild the ahenora.com web app
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main'
    # This job commits the rebuilt export back to main, so it alone gets write.
    permissions:
      contents: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL || vars.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      # Never set before 2026-09-07 because no OTA had reached an iPhone. The
      # app carries a committed fallback for it now (src/googleClientIds.ts), so
      # this is an override rather than a requirement — which is why it is not
      # in the preflight below.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      # Stamp the deployed web bundle with the commit it was built from, so
      # Settings shows which build is live — the web has no OTA update id, so
      # this is the only per-deploy signal there.
      EXPO_PUBLIC_BUILD_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Committing back needs the real branch, not a detached merge ref.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # The web app is the same code as the phone app, served at ahenora.com.
      # Before this job it was rebuilt by hand and drifted behind OTAs (the
      # "+" redesign shipped to phones while the web bundle stayed stale for a
      # week). Every merge that touches frontend/** now rebuilds and commits
      # the export, so "the web version is the same app" stays true by
      # machinery, not memory. api.ts falls back to the production backend URL
      # when the env var is absent, so a missing secret degrades safely.
      - name: Export the web app
        working-directory: frontend
        run: npx expo export --platform web --output-dir ../docs/app --clear

      - name: Commit the rebuilt export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app
          if git diff --cached --quiet; then
            echo "Web export unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Web: rebuild ahenora.com export for $GITHUB_SHA"
          # A docs/-only commit does not retrigger this workflow (frontend/**
          # path filter), and it is exactly what triggers the Pages deploy.
          # Rebase-and-retry so a concurrent push to main (a human merge, or
          # another workflow) can't reject this export with a non-fast-forward
          # and silently drop it until the next frontend merge.
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing on latest main"
            git pull --rebase origin main
          done
          git push origin main

  expo-update:
    name: Publish EAS update
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main'
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL || vars.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      # Never set before 2026-09-07 because no OTA had reached an iPhone. The
      # app carries a committed fallback for it now (src/googleClientIds.ts), so
      # this is an override rather than a requirement — which is why it is not
      # in the preflight below.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check Expo publish configuration
        id: expo_config
        shell: bash
        run: |
          missing=()

          if [ -z "$EXPO_TOKEN" ]; then
            missing+=("EXPO_TOKEN")
          fi
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            missing+=("EXPO_PUBLIC_BACKEND_URL")
          fi
          if [ -z "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]; then
            missing+=("EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID")
          fi
          if [ -z "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" ]; then
            missing+=("EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Expo update is skipped because the following GitHub Actions secrets/variables are missing: ${missing[*]}"
            echo "Add them under Repository > Settings > Secrets and variables > Actions to enable automatic EAS updates."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Expo publish configuration found. Continuing with EAS update."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.expo_config.outputs.publish == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.expo_config.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.expo_config.outputs.publish == 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # Both platforms. One runtimeVersion serves both, so this is the steady
      # state and the only correct value now that iOS is live.
      #
      # It was pinned to android from 2026-09-03 to 2026-09-07, while build 6 of
      # 1.1.0 sat in App Review: an update published to this channel can be
      # picked up by the build a reviewer is running, changing the app
      # underneath a review in progress. Apple approved on 2026-09-07 and the
      # pin came off the same day.
      #
      # Do not put it back without the same reason. Leaving it at android while
      # iOS is live means every OTA silently reaches half the users and the
      # workflow stays green while shipping nothing to iPhone — a fix that
      # appears to have gone out and has not. tests/test_workflow_publish_steps.py
      # holds the invariant: production's platforms must be a subset of
      # preview's, so a change here is checked against where it is tested.
      #
      # The comments live ABOVE the run block, not inside it: a `#` line inside
      # a `\` continuation does not comment the flag out, it ends the command
      # early and leaves the next line to be executed as its own command. The
      # previous version of this step did exactly that and would have exited
      # 127 on the next merge to main.
      # NOT staged, and this is the second attempt at that decision.
      #
      # A --rollout-percentage was added here on 2026-09-07 to contain a bad
      # update. It shipped, and the very next merge could not publish at all:
      #
      #   Cannot publish a new update with this runtime version while a rollout
      #   is in progress for the same runtime version. Before publishing a new
      #   update, the latest rollout percentage must be set to 100% or the
      #   rollout update deleted.
      #
      # EAS permits ONE rollout in progress per runtime version. Since nothing
      # auto-promotes, every merge after the first jammed the pipeline until a
      # person went and promoted by hand. On a repository that merges several
      # times a day that is not a safety feature, it is an outage of a
      # different kind: fixes stop reaching anybody, including urgent ones.
      #
      # Staging is still the right idea and the promote / watch / rollback
      # workflows remain. What it needs first is an answer to "what happens to
      # the previous canary when a new update is published" — promote it,
      # delete it, or refuse — and that answer has to be designed against the
      # constraint above rather than discovered by breaking production. See
      # docs/RUNBOOK-ota.md.
      - name: Publish update to the Expo production branch
        id: publish
        if: steps.expo_config.outputs.publish == 'true'
        working-directory: frontend
        run: |
          set -o pipefail
          npx eas-cli@latest update \
            --platform all \
            --branch production \
            --environment production \
            --message "GitHub $GITHUB_SHA" \
            --json \
            --non-interactive | tee update.json

          # The group id is what promote and rollback both take. Reading it here
          # means neither is a hunt through the Expo dashboard at the moment
          # somebody is trying to undo a bad release.
          GROUP=$(node -e '
            const fs = require("fs");
            let raw = fs.readFileSync("update.json", "utf8").trim();
            let data;
            try { data = JSON.parse(raw); } catch { process.exit(0); }
            const list = Array.isArray(data) ? data : [data];
            const id = list.map((u) => u && u.group).find(Boolean);
            if (id) process.stdout.write(id);
          ')
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      # The group id is still worth printing even without a rollout: it is what
      # OTA rollback and OTA watch both take, and hunting for it in the Expo
      # dashboard while trying to undo a bad release is exactly the wrong time.
      - name: Say what was published, and how to undo it
        if: steps.expo_config.outputs.publish == 'true'
        env:
          GROUP: ${{ steps.publish.outputs.group }}
        run: |
          {
            echo "## OTA published to everyone on runtime 2.0.0"
            echo
            if [ -n "$GROUP" ]; then
              echo "Update group: \`${GROUP}\`"
              echo
              echo "* Check on it: Actions -> **OTA watch** (launches, crashes, users)"
              echo "* Undo it: Actions -> **OTA rollback** — only while it is the"
              echo "  newest update on the branch, so before the next merge publishes."
            else
              echo "The update group id could not be read from the publish output."
              echo "Find it with \`eas update:list --branch production\` before rolling back."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
