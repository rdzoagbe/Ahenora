name: Store build sync

# Test phones on the NEXT store build keep getting the app's updates.
#
# A store build changes the runtime (runbooks/STORE-BUILD-checklist.md), and its
# branch (claude/store-build-*) is not merged until both stores serve it. Until
# then every merge to main publishes for the OLD runtime only, so the phones
# carrying the new build sat on that build's own JavaScript: on 2026-11-19
# Roland's test phones on 1.3.0 did not have the Family redesign that every
# family on 1.2.2 had had since the evening before.
#
# So, after each merge to main that changes the app: main is merged into each
# open store-build branch, and that branch's own "Frontend CI and Expo update"
# is run by hand with "publish now". That run does lint, typecheck and tests
# first, and it refuses to publish unless the branch's runtime differs from
# main's (see the expo-update job there), so nothing here can reach a phone on
# the store version.
#
# A merge that conflicts fails this run, loudly: it is resolved by hand on the
# branch, as any conflict is.
#
# THE OFF SWITCH: the file .github/store-build-sync.paused on main. From the
# day the new build goes to the stores (staged rollout, App Review), real
# families and Apple's reviewer carry that runtime too, and an update nobody
# has tried on the new build must not reach them by itself. Commit the file
# then; from there test-phone updates are sent by hand (Frontend CI and Expo
# update, on the branch, "publish now") until the branch merges. Delete the
# file when the next store build starts.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'legal/**'
      - '.github/workflows/store-build-sync.yml'
  workflow_dispatch:

concurrency:
  group: store-build-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Bring main into the store-build branch and publish for its runtime
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into each store-build branch whose runtime is not main's
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e .github/store-build-sync.paused ]; then
            echo "Paused (.github/store-build-sync.paused is on main): the store build is with the stores. Nothing merged or published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Empty for a branch with no app.json, or no runtime in it.
          runtime() { git show "$1:frontend/app.json" 2>/dev/null | node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync(0,'utf8')).expo.runtimeVersion||''))}catch(e){}" || true; }
          # A store build is AHEAD of main: 4.0.0 against 3.0.0. A branch left
          # behind after its build merged (3.0.0 once main is 4.0.0) is not one.
          newer() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ] && [ "$1" != "$2" ]; }
          live=$(runtime origin/main)
          failed=0
          branches=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/claude/store-build-*')
          if [ -z "$branches" ]; then
            echo "No store-build branch is open: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for branch in $branches; do
            mine=$(runtime "origin/$branch")
            if [ -z "$mine" ] || ! newer "$mine" "$live"; then
              # Merged already, never bumped, or left behind: main publishes
              # for the phones it has, or nobody carries it.
              echo "$branch (runtime ${mine:-none}) is not ahead of main's $live: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git checkout -q -B "$branch" "origin/$branch"
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "$branch already has main: nothing to merge or publish." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "::error title=Store build sync::main does not merge cleanly into $branch. Merge it by hand on that branch, then run Frontend CI and Expo update there with publish now; test phones on runtime $mine stay on the last update until then."
              failed=1
              continue
            fi
            # The store build's own versions must survive the merge.
            after=$(node -p "require('./frontend/app.json').expo.runtimeVersion")
            if [ "$after" != "$mine" ]; then
              echo "::error title=Store build sync::Merging main changed $branch's runtime from $mine to $after. Not pushed."
              failed=1
              continue
            fi
            git push origin "HEAD:refs/heads/$branch"
            gh workflow run frontend-ci-eas-update.yml --ref "$branch" -f publish_now=true
            echo "$branch: main merged in, and an update for runtime $mine is being published (after lint, typecheck and tests)." | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # One branch in trouble does not stop the others, and still fails the run.
          exit "$failed"
