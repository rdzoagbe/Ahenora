name: EAS Build (Android)

# Manually-triggered cloud build (+ optional auto-submit to Google Play).
# Runs on Expo's servers using the EXPO_TOKEN repo secret, so a production
# AAB can be produced and shipped without a local machine.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Auto-submit to Google Play after build (needs GOOGLE_SERVICE_ACCOUNT_KEY secret)'
        required: true
        default: true
        type: boolean
      track:
        description: 'Which Play track to submit to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (and submit) Android app
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build with EAS
        working-directory: frontend
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive

      # Runs unconditionally so that "why is my build not on Play?" is always
      # answered on the run page. A build that succeeds and then quietly does
      # not ship is the worst outcome: it looks green, and you only find out
      # days later when you go looking for it on your phone.
      - name: Check Google Play submit configuration
        id: submit_cfg
        working-directory: frontend
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          WANT_SUBMIT: ${{ github.event.inputs.submit }}
          PROFILE: ${{ github.event.inputs.profile }}
          TRACK: ${{ github.event.inputs.track }}
        run: |
          reason=""
          if [ "$WANT_SUBMIT" != "true" ]; then
            reason="'Auto-submit' was left off when this run was started."
          elif [ "$PROFILE" != "production" ] && [ "$PROFILE" != "preview" ]; then
            reason="Profile was '$PROFILE'; only 'production' and 'preview' build an app bundle Play will accept."
          elif [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            reason="The GOOGLE_SERVICE_ACCOUNT_KEY secret is not set (Settings > Secrets and variables > Actions)."
          fi

          if [ -n "$reason" ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Build was NOT sent to Google Play::$reason"
            {
              echo "### ⚠️ Built, but not submitted to Google Play"
              echo ""
              echo "$reason"
              echo ""
              echo "The app bundle is on Expo and can be downloaded from the EAS dashboard"
              echo "and uploaded to Play Console by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > play-service-account.json
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "### Submitting to the **$TRACK** track" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Submit latest build to Google Play
        if: ${{ steps.submit_cfg.outputs.submit == 'true' }}
        working-directory: frontend
        run: |
          npx eas-cli@latest submit \
            --platform android \
            --profile "${{ github.event.inputs.track }}" \
            --latest \
            --non-interactive

      - name: Confirm what landed where
        if: ${{ steps.submit_cfg.outputs.submit == 'true' }}
        run: |
          echo "Submitted to the ${{ github.event.inputs.track }} track." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up service account key
        if: ${{ always() }}
        working-directory: frontend
        run: rm -f play-service-account.json
