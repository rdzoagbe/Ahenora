name: EAS Build (Android)

# Manually-triggered cloud build (+ optional auto-submit to Google Play).
# Runs on Expo's servers using the EXPO_TOKEN repo secret, so a production
# AAB can be produced and shipped without a local machine.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Auto-submit to Google Play after build (needs GOOGLE_SERVICE_ACCOUNT_KEY secret)'
        required: true
        default: true
        type: boolean

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (and submit) Android app
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build with EAS
        working-directory: frontend
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive

      - name: Check Google Play submit configuration
        id: submit_cfg
        if: ${{ github.event.inputs.submit == 'true' && github.event.inputs.profile == 'production' }}
        working-directory: frontend
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_KEY secret is not set — skipping auto-submit."
            echo "Add it to enable build -> Google Play in one step."
            echo "submit=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > play-service-account.json
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit latest build to Google Play
        if: ${{ steps.submit_cfg.outputs.submit == 'true' }}
        working-directory: frontend
        run: |
          npx eas-cli@latest submit \
            --platform android \
            --profile production \
            --latest \
            --non-interactive

      - name: Clean up service account key
        if: ${{ always() }}
        working-directory: frontend
        run: rm -f play-service-account.json
