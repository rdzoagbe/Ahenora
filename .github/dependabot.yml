version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    # Expo SDK packages, react-native, and react must stay on the versions the
    # installed Expo SDK expects (managed via `npx expo install --fix`), so
    # dependabot must not bump them independently — doing so broke main once
    # already (PR #29 mixed SDK 54 and SDK 56 module versions).
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      # The SDK also ships packages with "expo" at the END of the name, which
      # none of the patterns above match. babel-preset-expo 57 -> 58 (an SDK 58
      # package on an SDK 57 app) arrived that way in #688 and passed CI,
      # because today's code still compiles. eslint-config-expo has the same
      # gap. Pinned to the SDK like the rest; moved by `npx expo install --fix`.
      - dependency-name: "*-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-google-signin/*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@types/react"
      # Majors of these are gated by eslint-config-expo / the Expo SDK toolchain.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-tooling:
        patterns:
          - "typescript"
          - "eslint"
          - "@typescript-eslint/*"
      # Catch-all: bundle every other npm update (incl. security) into ONE PR
      # instead of a flood. Assigned after frontend-tooling, so tooling still
      # groups separately.
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"