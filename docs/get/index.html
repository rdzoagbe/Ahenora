<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Getting Ahenora…</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon.png">
  <style>
    html,body{margin:0;height:100%;background:#F6F3EE;color:#101318;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;}
    img{width:72px;height:72px;border-radius:18px;}
    h1{font-size:20px;margin:0;font-weight:700;}
    p{margin:0;color:#5F656E;font-size:15px;max-width:34ch;line-height:1.5;}
    a{color:#B8410A;font-weight:600;}
    .sr{opacity:0;animation:in .25s ease .1s forwards;}
    @keyframes in{to{opacity:1;}}
  </style>
</head>
<body>
  <div class="wrap sr">
    <img src="/assets/icon.png" alt="Ahenora">
    <h1>Taking you to Ahenora…</h1>
    <p id="fallback">One moment. If nothing happens,
      <a id="manual" href="/app/">tap here to continue</a>.</p>
  </div>
  <script>
    // Send each phone to its own store: Android to Google Play, iPhone and
    // iPad to the App Store, and everything else (desktop, ChromeOS) to the
    // web app. This is the address the printed flyers' QR code carries, so
    // it has to be right for whoever scans it. A no-JS or slow client still
    // gets the manual link above, defaulted to the web app so it works on
    // every device.
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.householdcoo.app';
      var APPLE = 'https://apps.apple.com/app/id6806811163';
      var WEB = '/app/';
      var ua = navigator.userAgent || '';
      // Android phones/tablets, but NOT ChromeOS (which should use the web app).
      var isAndroid = /Android/i.test(ua) && !/CrOS/i.test(ua);
      // iPadOS reports itself as a Mac; a Mac with a touch screen is an iPad.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
      // Only these three fixed addresses, never anything read from the URL:
      // a redirect built from the query string is an open redirect. (There
      // is no web analytics, so a campaign tag had nothing to reach anyway.)
      var target = isAndroid ? PLAY : (isIOS ? APPLE : WEB);
      // Update the manual fallback to match the final target, then go.
      var manual = document.getElementById('manual');
      if (manual) manual.setAttribute('href', target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
